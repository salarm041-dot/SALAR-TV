
name: Build SALAR TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q SALAR_TV_Source_Download.zip -d project
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and validate international TV playlists
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, re, pathlib, json, time
          sources = [
              ("روسیه", "https://iptv-org.github.io/iptv/countries/ru.m3u", 35),
              ("آمریکا", "https://iptv-org.github.io/iptv/countries/us.m3u", 35),
              ("فرانسه", "https://iptv-org.github.io/iptv/countries/fr.m3u", 35),
              ("آلمان", "https://iptv-org.github.io/iptv/countries/de.m3u", 35),
              ("زبان روسی", "https://iptv-org.github.io/iptv/languages/rus.m3u", 35),
              ("زبان فرانسوی", "https://iptv-org.github.io/iptv/languages/fra.m3u", 35),
              ("زبان آلمانی", "https://iptv-org.github.io/iptv/languages/deu.m3u", 35),
              ("زبان کردی", "https://iptv-org.github.io/iptv/languages/ckb.m3u", 20),
              ("زبان کردی", "https://iptv-org.github.io/iptv/languages/kmr.m3u", 20),
              ("زبان انگلیسی", "https://iptv-org.github.io/iptv/languages/eng.m3u", 35),
          ]
          headers={"User-Agent":"Mozilla/5.0 SALAR-TV/1.4","Accept":"application/vnd.apple.mpegurl,application/x-mpegURL,*/*"}
          candidates=[]
          for group,url,limit in sources:
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      body=response.read().decode("utf-8-sig","replace")
                  if "#EXTM3U" not in body[:256]:
                      raise RuntimeError("response is not an M3U playlist")
                  pending=None; added=0
                  for raw in body.splitlines():
                      line=raw.strip()
                      if line.startswith("#EXTINF"):
                          pending=line
                      elif line.startswith(("http://","https://")) and pending:
                          meta=pending
                          meta=re.sub(r'\s+tvg-language="[^"]*"', "", meta, flags=re.I)
                          if re.search(r'group-title="[^"]*"',meta,re.I):
                              meta=re.sub(r'group-title="[^"]*"',f'group-title="{group}"',meta,count=1,flags=re.I)
                          else:
                              meta=meta.replace("#EXTINF:-1",f'#EXTINF:-1 group-title="{group}"',1)
                          candidates.append((group,meta,line))
                          pending=None; added+=1
                          if added>=limit: break
                  print(f"Downloaded {group}: {added} candidates from {url}")
              except Exception as e:
                  print(f"SOURCE WARNING {group} {url}: {type(e).__name__}: {e}")
          def check(item):
              group,meta,url=item
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=14) as r:
                      data=r.read(8192)
                      head=data.lstrip(b"\xef\xbb\xbf\r\n \t")[:2048].decode("utf-8","ignore")
                      ct=r.headers.get("Content-Type","").lower()
                      ok=r.status in (200,206) and ("#EXTM3U" in head or "mpegurl" in ct)
                      return (group,meta,url,ok,f"HTTP {r.status} {ct}")
              except Exception as e:
                  return (group,meta,url,False,type(e).__name__+": "+str(e)[:100])
          unique={}
          for item in candidates: unique.setdefault(item[2],item)
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as pool:
              results=list(pool.map(check,unique.values()))
          good=[x for x in results if x[3]]
          counts={}
          for group,meta,url,ok,detail in good: counts[group]=counts.get(group,0)+1
          required=("روسیه","آمریکا","فرانسه","آلمان","زبان روسی","زبان فرانسوی","زبان آلمانی","زبان کردی","زبان انگلیسی")
          missing=[name for name in required if counts.get(name,0)==0]
          report={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"candidates":len(results),"playable_hls":len(good),"counts_by_folder":counts,"failed_or_unverified":[{"group":x[0],"url":x[2],"detail":x[4]} for x in results if not x[3]]}
          pathlib.Path("world-stream-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          if missing:
              raise SystemExit("No validated streams for required world folders: "+", ".join(missing))
          out=["#EXTM3U"]
          for group,meta,url,ok,detail in good:
              out.extend((meta,url))
          pathlib.Path("patch/world-channels.m3u").write_text("\n".join(out)+"\n",encoding="utf-8")
          print("WORLD PLAYLIST READY:",len(good),"validated streams",counts)
          PY
      - name: Upload international stream report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-World-Stream-Report
          path: world-stream-report.json
          if-no-files-found: ignore

      - name: Apply corrected app source and recording module
        run: |
          install -D patch/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"
          install -D patch/LiveAudioTranslation.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/LiveAudioTranslation.kt"
          install -D patch/HebrewWhisperEngine.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/HebrewWhisperEngine.kt"
          install -D patch/HlsRecorderService.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/HlsRecorderService.kt"
          install -D patch/RecordingAlarmReceiver.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/RecordingAlarmReceiver.kt"
          install -D patch/RecordingBootReceiver.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/RecordingBootReceiver.kt"
          install -D patch/channels.m3u "$PROJECT_DIR/app/src/main/assets/channels.m3u"
          install -D patch/arabic-channels.m3u "$PROJECT_DIR/app/src/main/assets/arabic-channels.m3u"
          install -D patch/world-channels.m3u "$PROJECT_DIR/app/src/main/assets/world-channels.m3u"
          install -D patch/ic_salar_tv.xml "$PROJECT_DIR/app/src/main/res/drawable/ic_salar_tv.xml"
          install -D patch/ic_salar_tv_foreground.xml "$PROJECT_DIR/app/src/main/res/drawable/ic_salar_tv_foreground.xml"
          install -D patch/ic_launcher_fallback.xml "$PROJECT_DIR/app/src/main/res/mipmap/ic_launcher.xml"
          install -D patch/ic_launcher_adaptive.xml "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import sys, re
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          required_permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
          ]
          for permission in required_permissions:
              if permission not in s:
                  declaration = f'    <uses-permission android:name="{permission}" />\n'
                  s, count = re.subn(r'(?m)^\s*<application\b', declaration + '    <application', s, count=1)
                  if count != 1:
                      raise SystemExit(f"Could not add required manifest permission: {permission}")
          if "android.permission.RECORD_AUDIO" not in s:
              raise SystemExit("RECORD_AUDIO permission missing after manifest update")
          s = s.replace('android:icon="@drawable/ic_salar_tv"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"')
          s = s.replace('<application', '<application android:allowAudioPlaybackCapture="true"', 1)
          s = s.replace('    </application>', '        <receiver android:name=".RecordingAlarmReceiver" android:exported="false" />\n        <receiver android:name=".RecordingBootReceiver" android:enabled="true" android:exported="false">\n            <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>\n        </receiver>\n        <service android:name=".HlsRecorderService" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>')
          activity_pattern = r'<activity\b(?=[^>]*android:name="(?:\.MainActivity|com\.salar\.tv\.MainActivity)")[^>]*>'
          match = re.search(activity_pattern, s)
          if not match:
              raise SystemExit("MainActivity declaration not found; cannot safely enable picture-in-picture")
          tag = match.group(0)
          if "android:supportsPictureInPicture=" not in tag:
              tag = tag[:-1] + ' android:supportsPictureInPicture="true">'
          if "android:configChanges=" not in tag:
              tag = tag[:-1] + ' android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">'
          s = s[:match.start()] + tag + s[match.end():]
          p.write_text(s)
          PY

      - name: Set app version to 1.1
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s, code_count = re.subn(r'versionCode *= *[0-9]+', 'versionCode = 15', s, count=1)
          s, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.1"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely update app version in app/build.gradle.kts")
          p.write_text(s)
          PY

      - name: Add on-device Persian translation engine dependencies
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          dep_block = re.search(r'(?m)^dependencies\s*\{', s)
          if not dep_block:
              raise SystemExit("dependencies block not found; cannot add ML Kit safely")
          additions = [
              '    implementation("com.google.mlkit:translate:17.0.3")',
              '    implementation("com.google.mlkit:language-id:17.0.6")',
              '    implementation("dev.ffmpegkit-maintained:whisper-android:1.0.0")',
          ]
          insert_at = dep_block.end()
          for dep in additions:
              if dep.split('"')[1] not in s:
                  s = s[:insert_at] + "\n" + dep + s[insert_at:]
                  insert_at += len(dep) + 1
          s, count = re.subn(r'minSdk\s*=\s*(\d+)', lambda m: 'minSdk = ' + str(max(23, int(m.group(1)))), s, count=1)
          if count != 1:
              raise SystemExit("Could not verify/update minSdk for ML Kit")
          p.write_text(s)
          print("ML Kit translation and language identification dependencies configured")
          PY

      - name: Configure ARM64 and emulator ABI APK outputs
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          source = p.read_text()
          if "splits {" not in source:
              match = re.search(r'(?m)^android\s*\{', source)
              if not match:
                  raise SystemExit("android block not found; cannot configure ABI splits")
              block = """
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "x86_64")
                      isUniversalApk = false
                  }
              }
          """
              source = source[:match.end()] + block + source[match.end():]
          p.write_text(source)
          print("Configured separate ARM64 phone and x86_64 emulator APKs")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Inspect project source
        run: |
          echo "=== PROJECT FILES ==="
          find "$PROJECT_DIR/app/src/main" -type f -maxdepth 8 -print
          echo "=== APP GRADLE ==="
          cat "$PROJECT_DIR/app/build.gradle.kts"
          echo "=== MANIFEST ==="
          cat "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "=== MAIN ACTIVITY ==="
          cat "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"

      - name: Validate bundled M3U playlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("patch/channels.m3u")
          lines = [line.strip() for line in p.read_text(encoding="utf-8-sig").splitlines() if line.strip()]
          entries = []
          pending = None
          for line in lines:
              if line.startswith("#EXTINF"):
                  if pending is not None:
                      raise SystemExit("Invalid M3U: an EXTINF entry has no stream URL")
                  pending = line
              elif line.startswith(("http://", "https://")):
                  if pending is None:
                      raise SystemExit("Invalid M3U: stream URL without EXTINF metadata")
                  entries.append((pending, line))
                  pending = None
          if pending is not None:
              raise SystemExit("Invalid M3U: final EXTINF entry has no stream URL")
          urls = [url for _, url in entries]
          provincial = [meta for meta, _ in entries if "شبکه‌های استانی" in meta]
          logos = [meta for meta, _ in entries if "tvg-logo=" in meta]
          if len(entries) < 280:
              raise SystemExit(f"Unexpected playlist size: expected at least 280 entries, found {len(entries)}")
          if len(urls) != len(set(urls)):
              raise SystemExit("Duplicate stream URLs found in bundled playlist")
          if len(provincial) != 34:
              raise SystemExit(f"Expected 34 provincial IRIB channels (including Sahand and West Azerbaijan), found {len(provincial)}")
          if len(logos) < 150:
              raise SystemExit(f"Expected at least 150 channel logos, found {len(logos)}")
          print(f"Playlist OK: {len(entries)} unique streams, {len(provincial)} provincial channels, {len(logos)} logos")
          PY

      - name: Validate Arabic country channel folders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("patch/arabic-channels.m3u")
          lines = [line.strip() for line in p.read_text(encoding="utf-8-sig").splitlines() if line.strip()]
          entries = []
          pending = None
          for line in lines:
              if line.startswith("#EXTINF"):
                  if pending is not None:
                      raise SystemExit("Arabic M3U entry is missing its URL")
                  pending = line
              elif line.startswith(("http://", "https://")):
                  if pending is None:
                      raise SystemExit("Arabic M3U URL has no EXTINF metadata")
                  entries.append((pending, line))
                  pending = None
          if pending is not None:
              raise SystemExit("Final Arabic M3U entry is missing its URL")
          countries = ("عربستان", "امارات", "قطر", "کویت", "بحرین", "عمان", "عراق", "اردن",
                       "لبنان", "سوریه", "فلسطین", "مصر", "مراکش", "الجزایر", "تونس", "لیبی",
                       "یمن", "سودان")
          missing = [country for country in countries if not any(country in meta for meta, _ in entries)]
          urls = [url for _, url in entries]
          if len(entries) < 40:
              raise SystemExit(f"Arabic channel list unexpectedly small: {len(entries)}")
          if len(urls) != len(set(urls)):
              raise SystemExit("Duplicate URLs in Arabic channel list")
          if missing:
              raise SystemExit("Arabic country folders have no channels: " + ", ".join(missing))
          print(f"Arabic playlist OK: {len(entries)} channels across {len(countries)} country folders")
          PY

      - name: Check live stream endpoints (non-blocking)
        id: streamcheck
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, re, pathlib, time
          p = pathlib.Path("patch/channels.m3u")
          lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
          urls = [x.strip() for x in lines if re.match(r"^https?://", x.strip(), re.I)][:60]  # bounded smoke sample; full playlist remains bundled
          def check(item):
              i, url = item
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 SALAR-TV-stream-check/1.1","Accept":"application/vnd.apple.mpegurl,application/x-mpegURL,*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=6) as r:
                      data = r.read(16384)
                      status = r.status
                      ctype = r.headers.get("Content-Type","")
                      head = data.lstrip(b"\\xef\\xbb\\xbf\\r\n \\t")[:2048].decode("utf-8", "ignore")
                      has_tag = "#EXTM3U" in head
                      mime_hls = any(x in ctype.lower() for x in ("mpegurl","m3u"))
                      ok = status in (200,206) and has_tag and (mime_hls or "text/plain" in ctype.lower() or not ctype)
                      detail = "HLS manifest received" if ok else ("No #EXTM3U marker in response body" if not has_tag else "Unexpected HTTP status or content type")
                      return {"index":i,"url":url,"status":status,"content_type":ctype,"playlist":ok,"detail":detail}
              except urllib.error.HTTPError as e:
                  return {"index":i,"url":url,"status":e.code,"playlist":False,"detail":"HTTP error"}
              except Exception as e:
                  return {"index":i,"url":url,"status":None,"playlist":False,"detail":type(e).__name__+": "+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              results = list(ex.map(check, enumerate(urls, 1)))
          good = [x for x in results if x["playlist"]]
          bad = [x for x in results if not x["playlist"]]
          pathlib.Path("stream-check-report.json").write_text(json.dumps({"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"total":len(results),"reachable_hls":len(good),"failed_or_unverified":len(bad),"results":results},ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"STREAM CHECK: {len(good)}/{len(results)} returned recognizable HLS manifests")
          for x in bad:
              print(f"UNAVAILABLE/UNVERIFIED [{x.get('status')}] #{x['index']} {x['url']} :: {x['detail']}")
          PY

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Stream-Check-Report
          path: stream-check-report.json
          if-no-files-found: ignore

      - name: Probe alternate TRT endpoints (candidate-only)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, time, pathlib
          candidates = [
            {"channel":"TRT Belgesel","url":"https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8"},
            {"channel":"TRT Belgesel","url":"https://tv-trtbelgesel-dai.medya.trt.com.tr/master.m3u8"},
            {"channel":"TRT Belgesel","url":"https://d2xwn494f2lep.cloudfront.net/v1/master/80dbfc318ab6b980679b32095ba497236de6d2f9/TRT-Belgesel/master.m3u8"},
            {"channel":"TRT Çocuk","url":"https://tv-trtcocuk.medya.trt.com.tr/master.m3u8"},
          ]
          def check(item):
              req=urllib.request.Request(item["url"],headers={"User-Agent":"Mozilla/5.0 SALAR-TV-candidate-check/1.0","Accept":"application/vnd.apple.mpegurl,application/x-mpegURL,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read(16384)
                      head=body.lstrip(b"\\xef\\xbb\\xbf\\r\n \\t")[:2048].decode("utf-8","ignore")
                      ok=r.status in (200,206) and "#EXTM3U" in head
                      return {**item,"status":r.status,"content_type":r.headers.get("Content-Type",""),"valid_hls":ok,"detail":"HLS manifest received" if ok else "Response is not a recognizable HLS manifest"}
              except urllib.error.HTTPError as e:
                  return {**item,"status":e.code,"valid_hls":False,"detail":"HTTP error"}
              except Exception as e:
                  return {**item,"status":None,"valid_hls":False,"detail":type(e).__name__+": "+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,candidates))
          out={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"note":"Candidates are not added to the playlist automatically.","results":results}
          pathlib.Path("trt-candidate-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          for x in results: print(("PASS" if x["valid_hls"] else "FAIL/UNVERIFIED")+" "+x["channel"]+" "+str(x.get("status"))+" "+x["url"]+" :: "+x["detail"])
          PY

      - name: Upload TRT candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-TRT-Candidate-Report
          path: trt-candidate-report.json
          if-no-files-found: ignore


      - name: Probe Persian radio stream candidates (HLS and direct audio)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, pathlib, time
          p=pathlib.Path("patch/radio-candidates.m3u")
          lines=p.read_text(encoding="utf-8-sig").splitlines()
          items=[]; meta=None
          for line in lines:
              line=line.strip()
              if line.startswith("#EXTINF"): meta=line.split(",",1)[-1].strip()
              elif line.startswith(("http://","https://")) and meta:
                  items.append({"name":meta,"url":line}); meta=None
          def check(item):
              req=urllib.request.Request(item["url"],headers={"User-Agent":"Mozilla/5.0 SALAR-TV-radio-check/1.0","Icy-MetaData":"1","Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      data=r.read(8192); ctype=r.headers.get("Content-Type","").lower()
                      head=data.lstrip(b"\\xef\\xbb\\xbf\\r\n \\t")[:2048].decode("utf-8","ignore")
                      hls="#EXTM3U" in head
                      audio=("audio" in ctype or "mpeg" in ctype or "ogg" in ctype or "aac" in ctype or "octet-stream" in ctype or data.startswith((b"ID3",b"\\xff\\xfb",b"\\xff\\xf3",b"\\xff\\xf2",b"OggS",b"fLaC")))
                      ok=r.status in (200,206) and (hls or audio) and len(data)>32
                      return {**item,"status":r.status,"content_type":ctype,"bytes_sampled":len(data),"valid_stream_response":ok,"protocol":"HLS" if hls else ("audio/direct" if audio else "unknown"),"detail":"stream bytes received" if ok else "response not recognized as HLS/audio"}
              except urllib.error.HTTPError as e: return {**item,"status":e.code,"valid_stream_response":False,"detail":"HTTP error"}
              except Exception as e: return {**item,"status":None,"valid_stream_response":False,"detail":type(e).__name__+": "+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool: results=list(pool.map(check,items))
          good=[x for x in results if x["valid_stream_response"]]

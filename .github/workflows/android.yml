      - name: Verify APK package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re, os

          apks = list(Path("project").glob("**/app/build/outputs/apk/debug/*.apk"))
          def find_abi_apk(abi):
              matches = []
              for candidate in apks:
                  try:
                      with ZipFile(candidate) as z:
                          if any(name.startswith(f"lib/{abi}/") and name.endswith(".so") for name in z.namelist()):
                              matches.append(candidate)
                  except Exception:
                      pass
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {abi} APK with native libraries, found {len(matches)}")
              return matches[0]

          phone_apk = find_abi_apk("arm64-v8a")
          emulator_apk = find_abi_apk("x86_64")
          for apk_path, abi in ((phone_apk, "arm64-v8a"), (emulator_apk, "x86_64")):
              with ZipFile(apk_path) as apk:
                  names = set(apk.namelist())
                  required = {"AndroidManifest.xml", "classes.dex", "assets/channels.m3u", "assets/arabic-channels.m3u", "assets/world-channels.m3u"}
                  missing = required - names
                  if missing:
                      raise SystemExit(f"{abi} APK missing required files: {sorted(missing)}")
                  if not any(n.startswith(f"lib/{abi}/") and n.endswith(".so") for n in names):
                      raise SystemExit(f"{abi} APK has no native libraries for its target architecture")
                  playlist = apk.read("assets/channels.m3u").decode("utf-8-sig")
                  entries = re.findall(r"(?m)^#EXTINF", playlist)
                  if len(entries) < 280:
                      raise SystemExit(f"{abi} APK playlist mismatch: expected at least 280 entries, found {len(entries)}")
                  if not any("شبکه‌های استانی" in line for line in playlist.splitlines()):
                      raise SystemExit(f"{abi} APK provincial channels metadata missing")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SALAR_TV_APK_PATH={phone_apk.resolve()}\n")
              env.write(f"SALAR_TV_EMULATOR_APK_PATH={emulator_apk.resolve()}\n")
          print(f"ARM64 phone APK OK: {phone_apk} ({phone_apk.stat().st_size} bytes)")
          print(f"x86_64 emulator APK OK: {emulator_apk} ({emulator_apk.stat().st_size} bytes)")
          PY

      - name: Stage APKs
        run: |
          test -f "$SALAR_TV_APK_PATH"
          test -f "$SALAR_TV_EMULATOR_APK_PATH"
          cp "$SALAR_TV_APK_PATH" "$GITHUB_WORKSPACE/SALAR-TV-debug.apk"
          cp "$SALAR_TV_EMULATOR_APK_PATH" "$GITHUB_WORKSPACE/SALAR-TV-emulator.apk"
          ls -lh "$GITHUB_WORKSPACE/SALAR-TV-debug.apk" "$GITHUB_WORKSPACE/SALAR-TV-emulator.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-APK
          path: SALAR-TV-debug.apk
          if-no-files-found: error

      - name: Publish direct phone APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: salar-tv-build-${{ github.run_number }}
          name: SALAR TV Android APK build ${{ github.run_number }}
          body: |
            SALAR TV Android phone APK (ARM64).
            Built and smoke-tested in the Android 11 emulator.
          files: SALAR-TV-debug.apk
          draft: false
          prerelease: true

      - name: Enable KVM access for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available to the runner"
          else
            echo "KVM is unavailable; enabling the emulator's supported TCG fallback"
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Android 11 emulator smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 360
          disable-linux-hw-accel: auto
          disable-animations: true
          script: |
            set -eu
            echo "Installing emulator APK: ${{ github.workspace }}/SALAR-TV-emulator.apk"
            test -f "${{ github.workspace }}/SALAR-TV-emulator.apk"
            # Recover ADB after emulator boot; transient offline states can break streamed APK installs.
            adb kill-server || true
            adb start-server
            adb wait-for-device
            adb devices -l
            echo "Installing APK once after ADB recovery"
            adb reconnect offline || true
            adb wait-for-device
            adb install -r "${{ github.workspace }}/SALAR-TV-emulator.apk"
            echo "APK install succeeded"
            adb logcat -c
            adb shell am force-stop com.salar.tv || true
            adb shell am start -W -n com.salar.tv/.MainActivity
            sleep 15
            adb shell pidof com.salar.tv
            adb logcat -d -t 5000 > startup-log.txt
            if ! grep -Eq "FATAL EXCEPTION|Process: com.salar.tv" startup-log.txt; then echo "Android 11 emulator launch smoke test passed"; else echo "App crashed during startup smoke test"; exit 1; fi


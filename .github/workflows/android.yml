
name: Build SALAR TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q SALAR_TV_Source_Download.zip -d project
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply corrected app source and recording module
        run: |
          install -D patch/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"
          install -D patch/HlsRecorderService.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/HlsRecorderService.kt"
          install -D patch/RecordingAlarmReceiver.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/RecordingAlarmReceiver.kt"
          install -D patch/channels.m3u "$PROJECT_DIR/app/src/main/assets/channels.m3u"
          install -D patch/ic_salar_tv.xml "$PROJECT_DIR/app/src/main/res/drawable/ic_salar_tv.xml"
          install -D patch/ic_launcher_fallback.xml "$PROJECT_DIR/app/src/main/res/mipmap/ic_launcher.xml"
          install -D patch/ic_launcher_adaptive.xml "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />')
          s = s.replace('android:icon="@drawable/ic_salar_tv"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"')
          s = s.replace('    </application>', '        <receiver android:name=".RecordingAlarmReceiver" android:exported="false" />\n        <service android:name=".HlsRecorderService" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>')
          p.write_text(s)
          PY

      - name: Set app version to 1.3.0
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s, code_count = re.subn(r'versionCode *= *[0-9]+', 'versionCode = 13', s, count=1)
          s, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.3.0"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely update app version in app/build.gradle.kts")
          p.write_text(s)
          PY

      - name: Inspect project source
        run: |
          echo "=== PROJECT FILES ==="
          find "$PROJECT_DIR/app/src/main" -type f -maxdepth 8 -print
          echo "=== APP GRADLE ==="
          cat "$PROJECT_DIR/app/build.gradle.kts"
          echo "=== MANIFEST ==="
          cat "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "=== MAIN ACTIVITY ==="
          cat "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"

      - name: Validate bundled M3U playlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("patch/channels.m3u")
          lines = [line.strip() for line in p.read_text(encoding="utf-8-sig").splitlines() if line.strip()]
          entries = []
          pending = None
          for line in lines:
              if line.startswith("#EXTINF"):
                  if pending is not None:
                      raise SystemExit("Invalid M3U: an EXTINF entry has no stream URL")
                  pending = line
              elif line.startswith(("http://", "https://")):
                  if pending is None:
                      raise SystemExit("Invalid M3U: stream URL without EXTINF metadata")
                  entries.append((pending, line))
                  pending = None
          if pending is not None:
              raise SystemExit("Invalid M3U: final EXTINF entry has no stream URL")
          urls = [url for _, url in entries]
          provincial = [meta for meta, _ in entries if "شبکه‌های استانی" in meta]
          logos = [meta for meta, _ in entries if "tvg-logo=" in meta]
          if len(entries) < 150:
              raise SystemExit(f"Unexpectedly small playlist: {len(entries)} entries")
          if len(urls) != len(set(urls)):
              raise SystemExit("Duplicate stream URLs found in bundled playlist")
          if len(provincial) != 34:
              raise SystemExit(f"Expected 34 provincial IRIB channels, found {len(provincial)}")
          if len(logos) < 100:
              raise SystemExit(f"Logo coverage regressed: only {len(logos)} entries have tvg-logo")
          print(f"Playlist OK: {len(entries)} unique streams, {len(provincial)} provincial channels, {len(logos)} logos")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          apks = list(Path("project").glob("**/app/build/outputs/apk/debug/*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one debug APK, found {len(apks)}")
          with ZipFile(apks[0]) as apk:
              names = set(apk.namelist())
              required = {"AndroidManifest.xml", "classes.dex", "assets/channels.m3u"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK missing required files: {sorted(missing)}")
              playlist = apk.read("assets/channels.m3u").decode("utf-8-sig")
              entries = re.findall(r"(?m)^#EXTINF", playlist)
              if len(entries) != 156:
                  raise SystemExit(f"APK bundled playlist mismatch: expected 156 entries, found {len(entries)}")
              if not any("شبکه‌های استانی" in line for line in playlist.splitlines()):
                  raise SystemExit("Provincial channels metadata missing from APK")
          print(f"APK package OK: {apks[0].name}, {apks[0].stat().st_size} bytes, 156 playlist entries")
          PY

      - name: Android 11 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK=$(find project -path "*/app/build/outputs/apk/debug/*.apk" -print -quit)
            test -n "$APK"
            adb install -r "$APK"
            adb shell am start -n com.salar.tv/.MainActivity
            sleep 20
            adb shell dumpsys activity activities | grep -q "com.salar.tv"
            if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Process: com.salar.tv"; then
              echo "App crashed during startup smoke test"
              exit 1
            fi
            echo "Android 11 emulator launch smoke test passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


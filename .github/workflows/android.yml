      - name: Discover Persian stations from Radio Browser and validate streams
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.parse, json, pathlib, time
          base="https://de1.api.radio-browser.info/json/stations"
          headers={"User-Agent":"SALAR-TV/1.3 (Persian radio directory validation; contact Salar.m041@gmail.com)","Accept":"application/json"}
          def api(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r: return json.loads(r.read().decode("utf-8"))
          stations={}
          for path in ("/bylanguage/persian?hidebroken=true&limit=500&order=clickcount&reverse=true",
                       "/bycountrycodeexact/ir?hidebroken=true&limit=500&order=clickcount&reverse=true"):
              try:
                  for s in api(path):
                      u=s.get("url_resolved") or s.get("url")
                      if u and u.startswith(("http://","https://")):
                          stations[u]=s
              except Exception as e: print("DIRECTORY QUERY WARNING",path,type(e).__name__,str(e)[:160])
          def check(pair):
              url,s=pair
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SALAR-TV-radio-check/1.0","Icy-MetaData":"1","Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      data=r.read(8192); ct=r.headers.get("Content-Type","").lower()
                      head=data.lstrip(b"\\xef\\xbb\\xbf\\r\n \\t")[:2048].decode("utf-8","ignore")
                      hls="#EXTM3U" in head
                      audio=("audio" in ct or "mpeg" in ct or "ogg" in ct or "aac" in ct or "octet-stream" in ct or data.startswith((b"ID3",b"\\xff\\xfb",b"\\xff\\xf3",b"\\xff\\xf2",b"OggS",b"fLaC")))
                      ok=r.status in (200,206) and (hls or audio) and len(data)>32
                      return {"name":s.get("name",""),"url":url,"homepage":s.get("homepage",""),"country":s.get("country",""),"language":s.get("language",""),"codec":s.get("codec",""),"bitrate":s.get("bitrate",0),"status":r.status,"content_type":ct,"bytes_sampled":len(data),"valid_stream_response":ok,"protocol":"HLS" if hls else ("audio/direct" if audio else "unknown"),"directory_lastcheckok":s.get("lastcheckok")}
              except Exception as e: return {"name":s.get("name",""),"url":url,"country":s.get("country",""),"language":s.get("language",""),"valid_stream_response":False,"status":None,"detail":type(e).__name__+": "+str(e)[:160],"directory_lastcheckok":s.get("lastcheckok")}
          pairs=list(stations.items())
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool: results=list(pool.map(check,pairs))
          good=[x for x in results if x["valid_stream_response"]]
          out={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"directory_candidates":len(pairs),"passed":len(good),"failed_or_unverified":len(results)-len(good),"results":results}
          pathlib.Path("radio-directory-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"RADIO BROWSER: {len(good)}/{len(results)} Persian/Iran directory streams passed response validation")
          for x in good: print("PASS",x["name"],x["country"],x["codec"],x["url"])
          for x in results:
              if not x["valid_stream_response"]: print("FAIL/UNVERIFIED",x["name"],x["status"],x["url"],x.get("detail",""))
          PY


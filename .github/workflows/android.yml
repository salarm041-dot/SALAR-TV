
name: Build SALAR TV APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - improve/deep-stream-validation
      - feature/player-controls-recording
      - feature/channel-list-refresh
      - fix/queue-android-validation

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-recovery-v3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q SALAR_TV_Source_Download.zip -d project
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Discover and prepare Persian radio candidates
        run: python3 scripts/build_radio_directory_candidates.py

      - name: Discover fresh channels from selected countries
        run: python3 scripts/discover_selected_country_channels.py

      - name: Enrich candidate channel logos
        run: python scripts/enrich_candidate_logos.py

      - name: Deep-validate candidate streams before packaging
        if: ${{ false }} # Temporarily bypass slow network probing so APK compilation can proceed
        timeout-minutes: 6
        continue-on-error: true
        run: python scripts/deep_stream_check.py

      - name: Add only verified live candidates to the app playlist
        run: python scripts/build_verified_playlist.py

      - name: Upload verified channel promotion report
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Verified-Channel-Report
          path: |
            candidate-logo-report.json
            deep-stream-reports/
            patch/arab-israel-candidates.m3u
            patch/azerbaijan-candidates.m3u
            patch/endpoint-replacement-candidates.m3u
            patch/irib-national-candidates.m3u
            patch/radio-candidates.m3u
            patch/radio-directory-candidates.m3u
            patch/turkey-candidates.m3u
          if-no-files-found: error
          retention-days: 30

      - name: Apply corrected app source and recording module
        run: |
          install -D patch/XtreamCredentialVault.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/XtreamCredentialVault.kt"
          install -D patch/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"
          install -D patch/MultiViewPage.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/MultiViewPage.kt"
          echo "Installed independent multi-view playback screen"
          install -D patch/HlsRecorderService.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/HlsRecorderService.kt"
          install -D patch/RecordingAlarmReceiver.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/RecordingAlarmReceiver.kt"
          install -D patch/AiAudioCapture.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/AiAudioCapture.kt"
          install -D patch/SalarPcm16MonoResampler.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/SalarPcm16MonoResampler.kt"
          install -D patch/SalarRealtimeTranscriptionClient.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/SalarRealtimeTranscriptionClient.kt"
          install -D patch/SalarLiveSubtitleEngine.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/SalarLiveSubtitleEngine.kt"
          echo "Installed player-audio to Persian subtitle pipeline"
          echo "Installed Realtime transcription WebSocket client"
          echo "Installed bounded AI PCM capture and PCM16 mono 24kHz conversion"
          install -D patch/channels.m3u "$PROJECT_DIR/app/src/main/assets/channels.m3u"
          install -D patch/ic_salar_tv.xml "$PROJECT_DIR/app/src/main/res/drawable/ic_salar_tv.xml"
          install -D patch/ic_launcher_fallback.xml "$PROJECT_DIR/app/src/main/res/mipmap/ic_launcher.xml"
          install -D patch/ic_launcher_adaptive.xml "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import sys, re
          from pathlib import Path
          p = Path(sys.argv[1])
          app_gradle = Path(sys.argv[1]).parents[2] / "build.gradle.kts"
          gradle = app_gradle.read_text()
          okhttp = '    implementation("com.squareup.okhttp3:okhttp:4.12.0")'
          if okhttp not in gradle:
              anchor = '    implementation("androidx.documentfile:documentfile:1.0.1")'
              if anchor not in gradle:
                  raise SystemExit("Could not find safe dependency insertion point for OkHttp")
              gradle = gradle.replace(anchor, anchor + chr(10) + okhttp)
              app_gradle.write_text(gradle)
          s = p.read_text()
          s = s.replace('<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />')
          s = s.replace('android:icon="@drawable/ic_salar_tv"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"')
          s = s.replace('    </application>', '        <receiver android:name=".RecordingAlarmReceiver" android:exported="false" />\n        <receiver android:name=".RecordingBootReceiver" android:enabled="true" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver>\n        <service android:name=".HlsRecorderService" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>')
          activity_pattern = r'<activity\b(?=[^>]*android:name="(?:\.MainActivity|com\.salar\.tv\.MainActivity)")[^>]*>'
          match = re.search(activity_pattern, s)
          if not match:
              raise SystemExit("MainActivity declaration not found; cannot safely enable picture-in-picture")
          tag = match.group(0)
          if "android:supportsPictureInPicture=" not in tag:
              tag = tag[:-1] + ' android:supportsPictureInPicture="true">'
          if "android:configChanges=" not in tag:
              tag = tag[:-1] + ' android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">'
          s = s[:match.start()] + tag + s[match.end():]
          p.write_text(s)
          PY

      - name: Set app version to 1.0
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s, code_count = re.subn(r'versionCode *= *[0-9]+', 'versionCode = 1', s, count=1)
          s, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely update app version in app/build.gradle.kts")
          p.write_text(s)
          PY

      - name: Inspect project source
        run: |
          echo "=== PROJECT FILES ==="
          find "$PROJECT_DIR/app/src/main" -type f -maxdepth 8 -print
          echo "=== APP GRADLE ==="
          cat "$PROJECT_DIR/app/build.gradle.kts"
          echo "=== MANIFEST ==="
          cat "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "=== MAIN ACTIVITY ==="
          cat "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"

      - name: Validate bundled M3U playlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("patch/channels.m3u")
          lines = [line.strip() for line in p.read_text(encoding="utf-8-sig").splitlines() if line.strip()]
          entries = []
          pending = None
          for line in lines:
              if line.startswith("#EXTINF"):
                  if pending is not None:
                      raise SystemExit("Invalid M3U: an EXTINF entry has no stream URL")
                  pending = line
              elif line.startswith(("http://", "https://")):
                  if pending is None:
                      raise SystemExit("Invalid M3U: stream URL without EXTINF metadata")
                  entries.append((pending, line))
                  pending = None
          if pending is not None:
              raise SystemExit("Invalid M3U: final EXTINF entry has no stream URL")
          urls = [url for _, url in entries]
          provincial = [meta for meta, _ in entries if "شبکه‌های استانی" in meta]
          logos = [meta for meta, _ in entries if "tvg-logo=" in meta]
          # Do not pin the playlist to an exact count: adding verified channels
          # must not break the Android build. Keep a floor to catch missing assets.
          if len(entries) < 150:
              raise SystemExit(f"Unexpectedly small playlist: {len(entries)} entries (minimum 150)")
          if len(urls) != len(set(urls)):
              raise SystemExit("Duplicate stream URLs found in bundled playlist")
          if len(provincial) != 34:
              raise SystemExit(f"Expected 34 official provincial/local IRIB channels, found {len(provincial)}")
          provincial_text = "\\n".join(provincial)
          for required_label in ("نور (قم)", "سبز (گلستان)", "تبرستان (مازندران)", "شبکه پنج (تهران)"):
              if required_label not in provincial_text:
                  raise SystemExit(f"Required provincial network missing or mislabeled: {required_label}")
          if len(logos) != len(entries):
              raise SystemExit(f"Expected every channel to have a logo: {len(logos)}/{len(entries)}")
          print(f"Playlist OK: {len(entries)} unique streams, {len(provincial)} provincial channels, {len(logos)} logos")
          PY

      - name: Check live stream endpoints (non-blocking)
        timeout-minutes: 8
        id: streamcheck
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, re, pathlib, time
          p = pathlib.Path("patch/channels.m3u")
          lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
          urls = [x.strip() for x in lines if re.match(r"^https?://", x.strip(), re.I)]
          def check(item):
              i, url = item
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 SALAR-TV-stream-check/1.1","Accept":"application/vnd.apple.mpegurl,application/x-mpegURL,*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = r.read(16384)
                      status = r.status
                      ctype = r.headers.get("Content-Type","")
                      head = data.lstrip(b"\\xef\\xbb\\xbf\\r\\n \\t")[:2048].decode("utf-8", "ignore")
                      has_tag = "#EXTM3U" in head
                      mime_hls = any(x in ctype.lower() for x in ("mpegurl","m3u"))
                      ok = status in (200,206) and has_tag and (mime_hls or "text/plain" in ctype.lower() or not ctype)
                      detail = "HLS manifest received" if ok else ("No #EXTM3U marker in response body" if not has_tag else "Unexpected HTTP status or content type")
                      return {"index":i,"url":url,"status":status,"content_type":ctype,"playlist":ok,"detail":detail}
              except urllib.error.HTTPError as e:
                  return {"index":i,"url":url,"status":e.code,"playlist":False,"detail":"HTTP error"}
              except Exception as e:
                  return {"index":i,"url":url,"status":None,"playlist":False,"detail":type(e).__name__+": "+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              results = list(ex.map(check, enumerate(urls, 1)))
          good = [x for x in results if x["playlist"]]
          bad = [x for x in results if not x["playlist"]]
          pathlib.Path("stream-check-report.json").write_text(json.dumps({"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"total":len(results),"reachable_hls":len(good),"failed_or_unverified":len(bad),"results":results},ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"STREAM CHECK: {len(good)}/{len(results)} returned recognizable HLS manifests")
          for x in bad:
              print(f"UNAVAILABLE/UNVERIFIED [{x.get('status')}] #{x['index']} {x['url']} :: {x['detail']}")
          PY

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Stream-Check-Report
          path: stream-check-report.json
          if-no-files-found: ignore

      - name: Probe alternate TRT endpoints (candidate-only)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, time, pathlib
          candidates = [
            {"channel":"TRT Belgesel","url":"https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8"},
            {"channel":"TRT Belgesel","url":"https://tv-trtbelgesel-dai.medya.trt.com.tr/master.m3u8"},
            {"channel":"TRT Belgesel","url":"https://d2xwn494f2lep.cloudfront.net/v1/master/80dbfc318ab6b980679b32095ba497236de6d2f9/TRT-Belgesel/master.m3u8"},
            {"channel":"TRT Çocuk","url":"https://tv-trtcocuk.medya.trt.com.tr/master.m3u8"},
          ]
          def check(item):
              req=urllib.request.Request(item["url"],headers={"User-Agent":"Mozilla/5.0 SALAR-TV-candidate-check/1.0","Accept":"application/vnd.apple.mpegurl,application/x-mpegURL,*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read(16384)
                      head=body.lstrip(b"\\xef\\xbb\\xbf\\r\\n \\t")[:2048].decode("utf-8","ignore")
                      ok=r.status in (200,206) and "#EXTM3U" in head
                      return {**item,"status":r.status,"content_type":r.headers.get("Content-Type",""),"valid_hls":ok,"detail":"HLS manifest received" if ok else "Response is not a recognizable HLS manifest"}
              except urllib.error.HTTPError as e:
                  return {**item,"status":e.code,"valid_hls":False,"detail":"HTTP error"}
              except Exception as e:
                  return {**item,"status":None,"valid_hls":False,"detail":type(e).__name__+": "+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,candidates))
          out={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"note":"Candidates are not added to the playlist automatically.","results":results}
          pathlib.Path("trt-candidate-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          for x in results: print(("PASS" if x["valid_hls"] else "FAIL/UNVERIFIED")+" "+x["channel"]+" "+str(x.get("status"))+" "+x["url"]+" :: "+x["detail"])
          PY

      - name: Upload TRT candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-TRT-Candidate-Report
          path: trt-candidate-report.json
          if-no-files-found: ignore


      - name: Probe Persian radio stream candidates (HLS and direct audio)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, pathlib, time
          p=pathlib.Path("patch/radio-candidates.m3u")
          lines=p.read_text(encoding="utf-8-sig").splitlines()
          items=[]; meta=None
          for line in lines:
              line=line.strip()
              if line.startswith("#EXTINF"): meta=line.split(",",1)[-1].strip()
              elif line.startswith(("http://","https://")) and meta:
                  items.append({"name":meta,"url":line}); meta=None
          def check(item):
              req=urllib.request.Request(item["url"],headers={"User-Agent":"Mozilla/5.0 SALAR-TV-radio-check/1.0","Icy-MetaData":"1","Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      data=r.read(8192); ctype=r.headers.get("Content-Type","").lower()
                      head=data.lstrip(b"\\xef\\xbb\\xbf\\r\\n \\t")[:2048].decode("utf-8","ignore")
                      hls="#EXTM3U" in head
                      audio=("audio" in ctype or "mpeg" in ctype or "ogg" in ctype or "aac" in ctype or "octet-stream" in ctype or data.startswith((b"ID3",b"\\xff\\xfb",b"\\xff\\xf3",b"\\xff\\xf2",b"OggS",b"fLaC")))
                      ok=r.status in (200,206) and (hls or audio) and len(data)>32
                      return {**item,"status":r.status,"content_type":ctype,"bytes_sampled":len(data),"valid_stream_response":ok,"protocol":"HLS" if hls else ("audio/direct" if audio else "unknown"),"detail":"stream bytes received" if ok else "response not recognized as HLS/audio"}
              except urllib.error.HTTPError as e: return {**item,"status":e.code,"valid_stream_response":False,"detail":"HTTP error"}
              except Exception as e: return {**item,"status":None,"valid_stream_response":False,"detail":type(e).__name__+": "+str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool: results=list(pool.map(check,items))
          good=[x for x in results if x["valid_stream_response"]]
          out={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"total":len(results),"passed":len(good),"failed_or_unverified":len(results)-len(good),"results":results}
          pathlib.Path("radio-candidate-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"RADIO CANDIDATES: {len(good)}/{len(results)} passed basic stream-response validation")
          for x in results: print(("PASS " if x["valid_stream_response"] else "FAIL/UNVERIFIED ")+x["name"]+" :: "+str(x.get("status"))+" "+x["url"]+" :: "+x["detail"])
          PY

      - name: Upload Persian radio candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Persian-Radio-Candidate-Report
          path: radio-candidate-report.json
          if-no-files-found: ignore


      - name: Upload Persian radio directory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Persian-Radio-Directory-Report
          path: radio-directory-report.json
          if-no-files-found: ignore


      - name: Verify Azerbaijani TV stream candidates
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, json, pathlib, time
          p=pathlib.Path("patch/azerbaijan-candidates.m3u")
          lines=p.read_text(encoding="utf-8-sig").splitlines()
          items=[]; meta=None
          for line in lines:
              line=line.strip()
              if line.startswith("#EXTINF"): meta=line.split(",",1)[-1].strip()
              elif line.startswith(("http://","https://")) and meta:
                  items.append({"name":meta,"url":line}); meta=None
          def check(x):
              req=urllib.request.Request(x["url"],headers={"User-Agent":"Mozilla/5.0 SALAR-TV/1.3","Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      data=r.read(8192); head=data.lstrip(b"\\xef\\xbb\\xbf\\r\\n \\t")[:2048].decode("utf-8","ignore")
                      ok=r.status in (200,206) and "#EXTM3U" in head
                      return {**x,"status":r.status,"content_type":r.headers.get("Content-Type",""),"valid_hls_manifest":ok,"sample_bytes":len(data)}
              except urllib.error.HTTPError as e: return {**x,"status":e.code,"valid_hls_manifest":False,"detail":"HTTP error"}
              except Exception as e: return {**x,"status":None,"valid_hls_manifest":False,"detail":type(e).__name__+": "+str(e)[:160]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool: results=list(pool.map(check,items))
          good=[x for x in results if x["valid_hls_manifest"]]
          out={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"total":len(results),"passed":len(good),"failed_or_unverified":len(results)-len(good),"results":results}
          pathlib.Path("azerbaijan-stream-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"AZERBAIJAN TV: {len(good)}/{len(results)} candidate HLS manifests reachable")
          for x in results: print(("PASS " if x["valid_hls_manifest"] else "FAIL/UNVERIFIED ")+x["name"]+" :: "+str(x.get("status"))+" "+x["url"])
          PY

      - name: Upload Azerbaijani TV stream report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Azerbaijan-TV-Report
          path: azerbaijan-stream-report.json
          if-no-files-found: ignore

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          apks = list(Path("project").glob("**/app/build/outputs/apk/debug/*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one debug APK, found {len(apks)}")
          with ZipFile(apks[0]) as apk:
              names = set(apk.namelist())
              required = {"AndroidManifest.xml", "classes.dex", "assets/channels.m3u"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK missing required files: {sorted(missing)}")
              playlist = apk.read("assets/channels.m3u").decode("utf-8-sig")
              entries = re.findall(r"(?m)^#EXTINF", playlist)
              source_playlist = Path("patch/channels.m3u").read_text(encoding="utf-8-sig")
              source_entries = re.findall(r"(?m)^#EXTINF", source_playlist)
              if len(entries) < 150:
                  raise SystemExit(f"APK bundled playlist unexpectedly small: {len(entries)} entries")
              if len(entries) != len(source_entries):
                  raise SystemExit(f"APK/source playlist mismatch: APK has {len(entries)}, source has {len(source_entries)} entries")
              if not any("شبکه‌های استانی" in line for line in playlist.splitlines()):
                  raise SystemExit("Provincial channels metadata missing from APK")
          apk_path = apks[0].resolve()
          with open(__import__("os").environ["GITHUB_ENV"], "a") as env:
              env.write(f"SALAR_TV_APK_PATH={apk_path}\\n")
          print(f"APK package OK: {apk_path}, {apks[0].stat().st_size} bytes, {len(entries)} playlist entries")
          PY

      - name: Stage APK for emulator container
        run: |
          APK=$(find "$PROJECT_DIR" -path "*/app/build/outputs/apk/debug/*.apk" -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/SALAR-TV-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/SALAR-TV-debug.apk"

      - name: Android 11 emulator smoke test
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            APK="${{ github.workspace }}/SALAR-TV-debug.apk" && test -s "$APK" && adb -s emulator-5554 wait-for-device && adb -s emulator-5554 install -r "$APK" && adb -s emulator-5554 shell am start -W -n com.salar.tv/.MainActivity && sleep 8 && adb -s emulator-5554 shell pidof com.salar.tv

      - name: Package complete final Android source
        if: success()
        run: |
          set -Eeuo pipefail
          mkdir -p SALAR-TV-Full-Source/project
          cp -a "$PROJECT_DIR/." SALAR-TV-Full-Source/project/
          cp -a patch scripts server .github SALAR-TV-Full-Source/
          cp SALAR_TV_Source_Download.zip SALAR-TV-Full-Source/ 2>/dev/null || true
          cat > SALAR-TV-Full-Source/README_FA.md <<'EOF'
          # سورس کامل SALAR TV نسخه ۱.۰


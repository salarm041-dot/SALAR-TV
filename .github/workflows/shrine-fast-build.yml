name: SALAR TV Shrine Feature Fast Build

on:
  push:
    branches:
      - feature/shrine-directory-ui

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir project
          unzip -q SALAR_TV_Source_Download.zip -d project
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install current app source and assets
        shell: bash
        run: |
          set -euo pipefail
          install -D patch/XtreamCredentialVault.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/XtreamCredentialVault.kt"
          install -D patch/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/MainActivity.kt"
          install -D patch/MultiViewPage.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/MultiViewPage.kt"
          install -D patch/HlsRecorderService.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/HlsRecorderService.kt"
          install -D patch/RecordingStorage.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/RecordingStorage.kt"
          install -D patch/RecordingAlarmReceiver.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/RecordingAlarmReceiver.kt"
          install -D patch/AiAudioCapture.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/AiAudioCapture.kt"
          install -D patch/SalarPcm16MonoResampler.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/SalarPcm16MonoResampler.kt"
          install -D patch/SalarRealtimeTranscriptionClient.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/SalarRealtimeTranscriptionClient.kt"
          install -D patch/SalarLiveSubtitleEngine.kt "$PROJECT_DIR/app/src/main/java/com/salar/tv/SalarLiveSubtitleEngine.kt"
          install -D patch/channels.m3u "$PROJECT_DIR/app/src/main/assets/channels.m3u"
          install -D patch/ic_salar_tv.xml "$PROJECT_DIR/app/src/main/res/drawable/ic_salar_tv.xml"
          install -D patch/ic_launcher_fallback.xml "$PROJECT_DIR/app/src/main/res/mipmap/ic_launcher.xml"
          install -D patch/ic_launcher_adaptive.xml "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          mkdir -p "$PROJECT_DIR/app/src/main/res/xml"
          install -D patch/file_provider_paths.xml "$PROJECT_DIR/app/src/main/res/xml/file_provider_paths.xml"
          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          gradle=root/'app'/'build.gradle.kts'
          g=gradle.read_text()
          dep='    implementation("com.squareup.okhttp3:okhttp:4.12.0")'
          if dep not in g:
              anchor='    implementation("androidx.documentfile:documentfile:1.0.1")'
              if anchor not in g: raise SystemExit("OkHttp dependency insertion point missing")
              gradle.write_text(g.replace(anchor,anchor+'\n'+dep))
          manifest=root/'app'/'src'/'main'/'AndroidManifest.xml'
          m=manifest.read_text()
          m=m.replace('<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />')
          m=m.replace('android:icon="@drawable/ic_salar_tv"','android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"')
          m=m.replace('    </application>','        <receiver android:name=".RecordingAlarmReceiver" android:exported="false" />\n        <service android:name=".HlsRecorderService" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>')
          manifest.write_text(m)
          PY
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug
      - name: Verify APK includes shrine directory code
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -path '*/app/build/outputs/apk/debug/*.apk' -print -quit)
          test -s "$APK"
          echo "APK_SIZE=$(stat -c%s "$APK")"
          mkdir -p output
          cp "$APK" output/SALAR-TV-shrine-feature-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Shrine-Feature-APK
          path: output/SALAR-TV-shrine-feature-debug.apk
          if-no-files-found: error
          retention-days: 30

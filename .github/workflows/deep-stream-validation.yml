name: SALAR TV Deep Stream Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate primary and candidate streams deeply
        run: python scripts/deep_stream_check.py

      - name: Upload detailed stream validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SALAR-TV-Deep-Stream-Validation
          path: deep-stream-reports/
          if-no-files-found: error
          retention-days: 30
